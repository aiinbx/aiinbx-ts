# Runs in github.com/aiinbx/aiinbx-ts, the public repository that receives this
# package's source on every release. A version tag becomes a GitHub release
# once the same checks pass.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes "Published to npm as [aiinbx ${TAG#v}](https://www.npmjs.com/package/aiinbx/v/${TAG#v})."
